<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Day Malay Crash Course</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #00703c; } /* Malaysian Green */
        .day-section { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h2 { color: #d32f2f; font-size: 1.2rem; }
        .word-card { 
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; border: 1px solid #ddd; margin: 8px 0; padding: 12px;
            border-radius: 8px; cursor: pointer; transition: transform 0.1s;
        }
        .word-card:active { transform: scale(0.98); background: #e8f5e9; }
        .malay { font-weight: bold; color: #00703c; font-size: 1.1rem; }
        .english { color: #666; font-size: 0.9rem; }
        .phonetic { font-style: italic; color: #999; font-size: 0.8rem; }
        .play-icon { font-size: 1.2rem; }
        .info-box { background: #e3f2fd; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🇲🇾 Malay in 5 Days</h1>
    <p style="text-align:center; font-size: 0.9rem;">Tap any card to hear the pronunciation.</p>

    <div id="course-content"></div>

    <div class="info-box">
        <strong>Pro-Tip:</strong> Set your device's primary speech-to-text language to "Malay" in settings for the most authentic accent!
    </div>
</div>

<script>
    const lessons = [
        {
            day: "Day 1: Politeness & Survival",
            items: [
                { m: "Terima kasih", e: "Thank you", p: "Te-ree-mah ka-seh" },
                { m: "Sama-sama", e: "You're welcome", p: "Sah-mah sah-mah" },
                { m: "Tolong", e: "Please / Help", p: "Toh-long" },
                { m: "Maaf", e: "Sorry / Excuse me", p: "Mah-ahf" },
                { m: "Ya", e: "Yes", p: "Yah" },
                { m: "Tidak", e: "No", p: "Tee-da'" }
            ]
        },
        {
            day: "Day 2: Greetings",
            items: [
                { m: "Selamat pagi", e: "Good morning", p: "Pah-gee" },
                { m: "Selamat petang", e: "Good evening", p: "Puh-tang" },
                { m: "Apa khabar?", e: "How are you?", p: "Ah-pah kah-bar" },
                { m: "Khabar baik", e: "I am fine", p: "Kah-bar ba-ik" }
            ]
        },
        {
            day: "Day 3: Shopping & Money",
            items: [
                { m: "Berapa?", e: "How much?", p: "Be-rah-pah" },
                { m: "Mahal sangat", e: "Too expensive", p: "Mah-hal sa-ngat" },
                { m: "Boleh kurang?", e: "Can discount?", p: "Boh-leh koo-rang" },
                { m: "Tandas", e: "Toilet", p: "Tahn-dahs" }
            ]
        },
        {
            day: "Day 4: Dining",
            items: [
                { m: "Makan", e: "Eat", p: "Mah-kan" },
                { m: "Minum", e: "Drink", p: "Mee-num" },
                { m: "Tak pedas", e: "Not spicy", p: "Tak puh-dahs" },
                { m: "Kurang manis", e: "Less sweet", p: "Koo-rang mah-nees" },
                { m: "Bil, tolong", e: "Bill, please", p: "Bill toh-long" }
            ]
        }
    ];

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ms-MY'; // Sets language to Malay
        utterance.rate = 0.9;     // Slightly slower for learning
        window.speechSynthesis.speak(utterance);
    }

    const container = document.getElementById('course-content');

    lessons.forEach(lesson => {
        let section = document.createElement('div');
        section.className = 'day-section';
        section.innerHTML = `<h2>${lesson.day}</h2>`;
        
        lesson.items.forEach(item => {
            let card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = () => speak(item.m);
            card.innerHTML = `
                <div>
                    <div class="malay">${item.m}</div>
                    <div class="english">${item.e}</div>
                    <div class="phonetic">${item.p}</div>
                </div>
                <div class="play-icon">🔊</div>
            `;
            section.appendChild(card);
        });
        container.appendChild(section);
    });
</script>

</body>
</html>
